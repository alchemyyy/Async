plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
    id "com.modrinth.minotaur" version "2.+"
    id 'idea'
    id 'java-library'
}

// Resolve version group for source set selection
def versionGroup = gradle.ext.versionGroup

// AT/AW files are generated eagerly during common's configuration phase

repositories {
    maven { url 'https://api.modrinth.com/maven' }
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
}

// Manifold preprocessor: define version symbol for conditional compilation
def versionSymbol = [
    'v1_21_1'   : 'MC_VER_1_21_1',
    'v1_21_4_5' : 'MC_VER_1_21_4',
    'v1_21_8_10': 'MC_VER_1_21_8',
    'v1_21_11'  : 'MC_VER_1_21_11',
][versionGroup]

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xplugin:Manifold', "-A${versionSymbol}="]
}

apply plugin: 'com.modrinth.minotaur'
modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "async"
    versionNumber.set(project.version.toString())
    versionName.set(project.version.toString())
    versionType = "alpha"
    def libsDir = layout.buildDirectory.dir("libs").get().asFile
    uploadFile = libsDir.listFiles().find { it.name.endsWith(".jar") }
    gameVersions = [minecraft_version]
    loaders = ["fabric", "quilt"]
    dependencies {
        required.project "fabric-api"
        optional.project "lithium"
        optional.project "c2me-fabric"
        incompatible.project "moonrise-opt"
    }
    changelog = """
"""
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        if (project.hasProperty('parchment_minecraft_version') && project.hasProperty('parchment_mappings_version')) {
            def mcVer = project.parchment_minecraft_version
            def mapVer = project.parchment_mappings_version

            if (mcVer != null && mapVer != null && !mcVer.isBlank() && !mapVer.isBlank()) {
                parchment("org.parchmentmc.data:parchment-${mcVer}:${mapVer}@zip")
            }
        }
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    include(implementation(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-fabric:${mixinsquared_version}")))
    modImplementation 'com.electronwill.night-config:toml:3.8.1'
    include group: 'com.electronwill.night-config', name: 'toml', version: '3.8.1'
    include group: 'com.electronwill.night-config', name: 'core', version: '3.8.1'
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'systems.manifold:manifold-preprocessor:2026.1.4'

    implementation "maven.modrinth:lithium:${lithium_version}-neoforge"
    modImplementation(include("me.lucko:fabric-permissions-api:${project.permission_api}"))
}

loom {
    mixin.useLegacyMixinAp = true

    // Use the eagerly-generated AW from common's cascading overlay system
    def generatedAw = project(':common').layout.buildDirectory.dir("generated-at-aw").get().file("async.accesswidener").asFile
    if (generatedAw.exists()) {
        accessWidenerPath.set(generatedAw)
    }

    mixin {
        defaultRefmapName.set("async.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
