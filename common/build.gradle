plugins {
    id 'net.neoforged.moddev'
    id 'idea'
}

// Resolve version group for source set selection
def versionGroup = gradle.ext.versionGroup

neoForge {
    neoFormVersion = neoform_version

    // Check version-specific AT first, fall back to main
    def versionAt = file("src/${versionGroup}/resources/META-INF/accesstransformer.cfg")
    def mainAt = file('src/main/resources/META-INF/accesstransformer.cfg')
    def atFile = versionAt.exists() ? versionAt : mainAt
    if (atFile.exists()) {
        accessTransformers.from(atFile.absolutePath)
    }

    if (project.hasProperty('parchment_mappings_version') && project.hasProperty('parchment_minecraft_version')) {
        def parchmentMappings = project.parchment_mappings_version
        def parchmentMinecraft = project.parchment_minecraft_version

        if (parchmentMappings != null && parchmentMinecraft != null &&
                !parchmentMappings.toString().isBlank() && !parchmentMinecraft.toString().isBlank()) {

            parchment {
                mappingsVersion = parchmentMappings
                minecraftVersion = parchmentMinecraft
            }
        }
    }
}

// Add version-specific source directories
sourceSets.main {
    java.srcDirs += "src/${versionGroup}/java"
    resources.srcDirs += "src/${versionGroup}/resources"
}

repositories {
    maven { url = 'https://maven.bawnorton.com/releases' }
    maven { url 'https://api.modrinth.com/maven' }
}

dependencies {
    implementation("io.github.llamalad7:mixinextras-common:${mixinextras_version}")
    annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}")
    compileOnly("org.spongepowered:mixin:${mixin_version}")
    implementation(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-common:${mixinsquared_version}"))
    implementation("org.ow2.asm:asm:9.6")
    implementation("org.ow2.asm:asm-tree:9.6")
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'
    implementation "maven.modrinth:lithium:${lithium_version}-neoforge"
}

// Expose source directories for consumption by fabric/neoforge modules
configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

// Register ALL source directories (main + version) as artifacts
sourceSets.main.java.sourceDirectories.each { dir ->
    if (dir.exists()) {
        artifacts {
            commonJava dir
        }
    }
}
sourceSets.main.resources.sourceDirectories.each { dir ->
    if (dir.exists()) {
        artifacts {
            commonResources dir
        }
    }
}
