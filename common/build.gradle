plugins {
    id 'net.neoforged.moddev'
    id 'idea'
}

// Resolve version group for source set selection
def versionGroup = gradle.ext.versionGroup

// Cascade order: base -> 1_21_4 -> 1_21_8 -> 1_21_11
def cascadeOrder = ['1_21_4', '1_21_8', '1_21_11']
def versionGroupToCascadeStop = [
    'v1_21_1'   : -1,       // base only, no overlays
    'v1_21_4_5' : 0,        // apply 1_21_4
    'v1_21_8_10': 1,        // apply 1_21_4 + 1_21_8
    'v1_21_11'  : 2,        // apply 1_21_4 + 1_21_8 + 1_21_11
]

// Helper: apply cascade overlays to a set of lines
// In overlay files: normal lines = additions, lines starting with # = removals
def applyCascadeOverlays = { LinkedHashSet<String> lines, String pathPattern ->
    def stopIndex = versionGroupToCascadeStop[versionGroup]
    for (int i = 0; i <= stopIndex; i++) {
        def overlayFile = file(pathPattern.replace('VERSION', cascadeOrder[i]))
        if (overlayFile.exists()) {
            overlayFile.eachLine { line ->
                def trimmed = line.trim()
                if (!trimmed) return
                if (trimmed.startsWith('#')) {
                    lines.remove(trimmed.substring(1).trim())
                } else {
                    lines.add(trimmed)
                }
            }
        }
    }
}

// Generated AT/AW output directory — files are generated eagerly at configuration time
// because both Loom and NeoForge ModDev need them before task execution
def generatedAtAwDir = layout.buildDirectory.dir("generated-at-aw")

// Clean and regenerate every time
def atAwOutDir = generatedAtAwDir.get().asFile
if (atAwOutDir.exists()) atAwOutDir.deleteDir()

// Eagerly generate AT
def atBaseFile = file("src/main/resources/META-INF/accesstransformer.cfg")
def atOutFile = generatedAtAwDir.get().file("META-INF/accesstransformer.cfg").asFile
atOutFile.parentFile.mkdirs()
def atLines = new LinkedHashSet<String>(atBaseFile.readLines().findAll { it.trim() && !it.trim().startsWith('#') })
applyCascadeOverlays(atLines, 'src/main/resources/META-INF/accesstransformer.VERSION.cfg')
atOutFile.text = atLines.sort().join('\n') + '\n'

// Eagerly generate AW
def awBaseFile = file("src/main/resources/async.accesswidener")
def awOutFile = generatedAtAwDir.get().file("async.accesswidener").asFile
def awAllLines = awBaseFile.readLines()
def awHeader = awAllLines.find { it.startsWith('accessWidener') } ?: 'accessWidener   v1  named'
def awLines = new LinkedHashSet<String>(awAllLines.findAll { it.trim() && !it.startsWith('accessWidener') })
applyCascadeOverlays(awLines, 'src/main/resources/async.accesswidener.VERSION.accesswidener')
awOutFile.text = awHeader + '\n' + awLines.sort().join('\n') + '\n'

neoForge {
    neoFormVersion = neoform_version

    // Use the eagerly-generated AT
    def generatedAt = generatedAtAwDir.get().file("META-INF/accesstransformer.cfg").asFile
    if (generatedAt.exists()) {
        accessTransformers.from(generatedAt.absolutePath)
    }

    if (project.hasProperty('parchment_mappings_version') && project.hasProperty('parchment_minecraft_version')) {
        def parchmentMappings = project.parchment_mappings_version
        def parchmentMinecraft = project.parchment_minecraft_version

        if (parchmentMappings != null && parchmentMinecraft != null &&
                !parchmentMappings.toString().isBlank() && !parchmentMinecraft.toString().isBlank()) {

            parchment {
                mappingsVersion = parchmentMappings
                minecraftVersion = parchmentMinecraft
            }
        }
    }
}

// Generate async.version.mixins.json by cascading overlay files onto the base mixin JSON
def generatedResourcesDir = layout.buildDirectory.dir("generated-resources")

tasks.register('generateVersionMixins') {
    def baseFile = file("src/main/resources/async.common.mixins.json")
    def outputFile = generatedResourcesDir.map { it.file("async.version.mixins.json") }
    inputs.property('versionGroup', versionGroup)
    inputs.file(baseFile)
    cascadeOrder.each { ver ->
        def overlayFile = file("src/main/resources/async.common.${ver}.mixins.json")
        if (overlayFile.exists()) inputs.file(overlayFile)
    }
    outputs.file(outputFile)

    doLast {
        def slurper = new groovy.json.JsonSlurper()
        def baseJson = slurper.parse(baseFile)
        def mixins = new LinkedHashSet<String>(baseJson.mixins)

        def stopIndex = versionGroupToCascadeStop[versionGroup]
        for (int i = 0; i <= stopIndex; i++) {
            def overlayFile = file("src/main/resources/async.common.${cascadeOrder[i]}.mixins.json")
            if (overlayFile.exists()) {
                def overlay = slurper.parse(overlayFile)
                if (overlay.add) mixins.addAll(overlay.add)
                if (overlay.remove) mixins.removeAll(overlay.remove)
            }
        }

        def sorted = mixins.toList().sort()
        def json = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                required          : true,
                minVersion        : "0.8",
                "package"         : "com.axalotl.async.common.mixin",
                compatibilityLevel: "JAVA_21",
                mixins            : sorted,
                client            : [],
                server            : [],
                injectors         : [defaultRequire: 1],
                plugin            : "com.axalotl.async.common.mixin.utils.AsyncModMixinCanceller"
        ]))
        outputFile.get().asFile.parentFile.mkdirs()
        outputFile.get().asFile.text = json + '\n'
    }
}

tasks.named('processResources') {
    dependsOn('generateVersionMixins')
    // Exclude base/overlay AT/AW and mixin overlay files — generated versions are used instead
    exclude 'META-INF/accesstransformer*.cfg'
    exclude 'async.accesswidener*'
    exclude 'async.common.*.mixins.json'
    exclude 'v1_21_*/**'
}

sourceSets.main {
    resources {
        srcDir(generatedResourcesDir)
        srcDir(generatedAtAwDir)
    }
}

repositories {
    maven { url = 'https://maven.bawnorton.com/releases' }
    maven { url 'https://api.modrinth.com/maven' }
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
}

// Manifold preprocessor: define version symbol for conditional compilation
def versionSymbol = [
    'v1_21_1'   : 'MC_VER_1_21_1',
    'v1_21_4_5' : 'MC_VER_1_21_4',
    'v1_21_8_10': 'MC_VER_1_21_8',
    'v1_21_11'  : 'MC_VER_1_21_11',
][versionGroup]

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xplugin:Manifold', "-A${versionSymbol}="]
}

dependencies {
    implementation("io.github.llamalad7:mixinextras-common:${mixinextras_version}")
    annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}")
    compileOnly("org.spongepowered:mixin:${mixin_version}")
    implementation(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-common:${mixinsquared_version}"))
    implementation("org.ow2.asm:asm:9.6")
    implementation("org.ow2.asm:asm-tree:9.6")
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'
    implementation "maven.modrinth:lithium:${lithium_version}-neoforge"
    annotationProcessor 'systems.manifold:manifold-preprocessor:2026.1.4'
}

// Expose source directories for consumption by fabric/neoforge modules
configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava file("src/main/java")
}

// Filtered resources: merge main resources + all generated resources for the artifact
def filteredMainResources = layout.buildDirectory.dir("filtered-main-resources")
tasks.register('filterMainResources', Sync) {
    dependsOn('generateVersionMixins')
    from("src/main/resources") {
        // Exclude overlay files, version-specific dirs, and base AT/AW (generated versions used instead)
        exclude 'META-INF/accesstransformer*.cfg'
        exclude 'async.accesswidener*'
        exclude 'async.common.*.mixins.json'
        exclude 'v1_21_*/**'
    }
    from(generatedResourcesDir)
    from(generatedAtAwDir)
    into filteredMainResources
}
artifacts {
    commonResources(filteredMainResources) { builtBy 'filterMainResources' }
}
