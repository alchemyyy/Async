pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupByRegex("net\\.fabricmc(\\..+)?")
                includeGroup('fabric-loom')
            }
        }

        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = uri('https://repo.spongepowered.org/repository/maven-public')
                }
            }
            filter {
                includeGroupAndSubgroups("org.spongepowered")
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// =============================================================================
// Multi-Version Resolution
// =============================================================================
// Resolves version group from target_minecraft_version and loads properties
// from gradle.1_21_X.properties files.
// To build all versions at once, use buildAll.bat / buildAll.sh
// =============================================================================

def targetVersion = settings.ext.has('target_minecraft_version')
        ? settings.ext.target_minecraft_version.toString()
        : '1.21.11'

// Parse minor version number (e.g., "1.21.11" -> 11, "1.21.1" -> 1)
def parts = targetVersion.split('\\.')
int minor = (parts.length >= 3) ? (parts[2] as int) : 11

String versionGroup
if (minor <= 1) versionGroup = 'v1_21_1'
else if (minor <= 5) versionGroup = 'v1_21_4_5'
else if (minor <= 10) versionGroup = 'v1_21_8_10'
else versionGroup = 'v1_21_11'

// Load group properties: gradle.1_21_X.properties
def groupPropsFile = file("gradle.${versionGroup.substring(1)}.properties")
if (groupPropsFile.exists()) {
    def versionProps = new Properties()
    groupPropsFile.withInputStream { versionProps.load(it) }

    // Exact-version override (e.g. gradle.1_21_10.properties within v1_21_8_10)
    def exactFile = file("gradle.1_21_${minor}.properties")
    if (exactFile.exists() && exactFile.canonicalPath != groupPropsFile.canonicalPath) {
        exactFile.withInputStream { versionProps.load(it) }
    }

    versionProps.each { k, v -> gradle.ext.set(k.toString(), v.toString()) }
}

gradle.ext.set('versionGroup', versionGroup)

// This should match the folder name of the project, or else IDEA may complain
rootProject.name = 'AsyncMultiloader'
include('common')
include('fabric')
include('neoforge')
