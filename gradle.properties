# =============================================================================
# Async Multi-Version Build Configuration
# =============================================================================
# Set target_minecraft_version to build for a specific MC version.
# Version-specific dependencies are loaded from versions/v1_21_X.properties
# =============================================================================

target_minecraft_version=1.21.4

# =============================================================================
# Shared Properties (version-independent)
# =============================================================================

group=com.axalotl.async
java_version=21

# Mod Metadata
mod_name=Async
mod_author=AxalotL, Alchemy, Bliss, FurryMileon, Grider, jediminer543
mod_id=async
license=GPL-3.0
credits=
description=Async-Minecraft Entity Multi-Threading Mod

# NeoForge Loader
neoforge_loader_version_range=[1,)

# Mixin versions
mixin_version=0.8.5
mixin_min_version=0.8.5

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
